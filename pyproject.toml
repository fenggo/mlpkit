[build-system]
requires = ["setuptools>=64", "wheel", "Cython>=3.0", "numpy>=1.20"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpkit"
version = "0.1.0"
description = "MLP Kit — An ensemble of toolkit for machine learning potential"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "FengGo"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scikit-learn>=1.0",
    "ase>=3.22",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
mlpkit = "mlpkit.cli:main"

[project.urls]
Homepage = "https://github.com/FengGo/mlpkit"
Repository = "https://github.com/FengGo/mlpkit"

[tool.setuptools.packages.find]
include = ["mlpkit*"]

[tool.setuptools.package-data]
mlpkit = ["*.md", "*.txt", "*.pyx", "*.pxd"]
